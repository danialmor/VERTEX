<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VERTEX | MSP Optimizer</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e5edf8;font:16px Tahoma,Arial,sans-serif}main{max-width:1100px;margin:auto;padding:32px}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}a{color:#8bc5ff}h1{font-size:clamp(24px,4vw,42px)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}section{background:#142238;border:1px solid #30435e;border-radius:16px;padding:22px}label{display:block;margin:12px 0}select,input,button{font:inherit}select,input[type=date],button{background:#0b1220;color:#e5edf8;border:1px solid #536780;border-radius:8px;padding:10px;width:100%}button:disabled{opacity:.5}small,p{line-height:1.9;color:#a9bcd2}.status{color:#ffc77b}</style></head><body><main><header><strong>VERTEX / MSP OPTIMIZER</strong><a href="../msp-bi/">MSP-BI</a></header><h1>مدیریت هوشمند زمان‌بندی</h1><p class="status">نسخه توسعه ۰.۱ — اتصال به MSP برقرار نیست</p><div class="grid"><section><h2>قفل پایان WBS</h2><label for="target">تاریخ هدف (میلادی)</label><input id="target" type="date"><p>انتخاب WBS پس از اتصال به افزونه فعال می‌شود.</p></section><section><h2>روش بهینه‌سازی</h2><label for="method">روش</label><select id="method"><option value="equal">Equal</option></select><label for="scope">دامنه</label><select id="scope"><option value="selectedWbs">WBS انتخابی</option><option value="entireProject">کل پروژه</option></select></section><section><h2>حفاظت اطلاعات</h2><label><input type="checkbox" checked disabled> Actual</label><label><input type="checkbox" checked disabled> Logic</label><label><input type="checkbox" checked disabled> Milestones</label><label><input type="checkbox" checked disabled> Baseline</label></section><section><h2>عملیات</h2><button disabled>پیش‌نمایش تغییرات</button><p>موتور COM و Bridge هنوز نصب و متصل نشده‌اند.</p><button disabled>اعمال تغییرات</button></section></div><section style="margin-top:16px"><h2>پروفایل آزمایشی</h2><button id="export">خروجی JSON تنظیمات</button><p id="notice" role="status">اطلاعات پروژه ذخیره یا ارسال نمی‌شود.</p></section></main><script>document.getElementById('export').onclick=()=>{const target=document.getElementById('target').value;if(!target){document.getElementById('notice').textContent='تاریخ هدف را وارد کنید.';return;}const profile={schemaVersion:1,mode:'preview',autoApply:false,method:'equal',scope:document.getElementById('scope').value,targetDate:target,protect:{actual:true,logic:true,milestones:true,baseline:true}};const url=URL.createObjectURL(new Blob([JSON.stringify(profile,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='msp-optimizer-profile.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('notice').textContent='خروجی تنظیمات آزمایشی ایجاد شد.';};</script></body></html>
