name: MSP Optimizer experimental build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/feature/msp-optimizer'
    runs-on: [self-hosted, Windows, X64, msp2016-build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build installer
        shell: powershell
        run: |
          if (!$env:MSP_PIA_PATH) { throw 'Configure MSP_PIA_PATH on the trusted runner' }
          & .\msp-optimizer\installer\build.ps1 -OfficePiaPath $env:MSP_PIA_PATH
      - uses: actions/upload-artifact@v4
        with:
          name: MSP-Optimizer-Experimental
          path: msp-optimizer/installer/output/Setup.exe
          if-no-files-found: error
          retention-days: 7
